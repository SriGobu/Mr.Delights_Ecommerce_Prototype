<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product photo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e3"/>
      <stop offset="1" stop-color="#eadfc4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c56a"/>
      <stop offset="1" stop-color="#b8892f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="360" r="150" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="400" cy="360" r="128" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 10"/>
  <g fill="url(#gold)">
    <ellipse cx="365" cy="375" rx="34" ry="52" transform="rotate(-24 365 375)"/>
    <ellipse cx="435" cy="375" rx="34" ry="52" transform="rotate(24 435 375)"/>
    <ellipse cx="400" cy="330" rx="30" ry="48"/>
  </g>
  <text x="400" y="595" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#1f4d36">MR Delights</text>
  <text x="400" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="6" fill="#8a7a4a">PHOTO COMING SOON</text>
</svg>